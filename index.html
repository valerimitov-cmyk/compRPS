<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPS Arena – Rock Paper Scissors with Queue & Spectators</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0f1220; --panel:#181c30; --panel2:#20253d; --text:#e8eaf6; --muted:#8b90b0;
    --accent:#6c7bff; --good:#3ddc97; --bad:#ff5c7a; --warn:#ffc857; --border:#2c3250;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  h1,h2,h3{margin:0}
  button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:10px 16px;border-radius:10px;transition:.15s}
  button:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.sel{border-color:var(--good);background:rgba(61,220,151,.15)}
  input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);width:100%}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
  .muted{color:var(--muted)}
  .hidden{display:none!important}
  /* lobby */
  #lobby{max-width:460px;margin:8vh auto 0}
  #lobby .card{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:8px}
  .err{color:var(--bad);min-height:1.2em;font-size:.9rem}
  /* game */
  .top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
  .pill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:.85rem}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .arena{text-align:center;display:flex;flex-direction:column;gap:14px}
  .vs{display:flex;align-items:center;justify-content:space-around;gap:8px}
  .fighter{flex:1;background:var(--panel2);border:2px solid var(--border);border-radius:14px;padding:14px 8px;min-width:0}
  .fighter.featured{border-color:var(--warn)}
  .fighter.winner{border-color:var(--good);box-shadow:0 0 18px rgba(61,220,151,.35)}
  .fighter .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fighter .big{font-size:3.2rem;line-height:1.3}
  .tag{font-size:.75rem;color:var(--warn)}
  .bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .bar>div{height:100%;background:var(--accent);width:100%;transition:width .25s linear}
  .moves{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .moves button{font-size:1.6rem;padding:12px 20px;min-width:110px}
  .moves button small{display:block;font-size:.75rem;color:var(--muted)}
  .banner{padding:10px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--border)}
  .banner.good{border-color:var(--good)} .banner.bad{border-color:var(--bad)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.92rem}
  li:last-child{border:0}
  .num{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.8rem;margin-right:8px}
  .side{display:flex;flex-direction:column;gap:14px}
  .me{color:var(--good)}
  .guess h3{font-size:.95rem;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOBBY -->
  <div id="lobby">
    <div class="card">
      <h1>✊✋✌️ RPS Arena</h1>
      <p class="muted" style="margin:0">Rock-Paper-Scissors with a waiting queue. 2 players at a time, up to 30 spectators who can guess the result. Peer-to-peer via PeerJS.</p>
      <input id="nameInput" placeholder="Your name" maxlength="16">
      <button class="primary" id="createBtn">Create a room (I'm the host)</button>
      <div class="muted" style="text-align:center">— or —</div>
      <div class="row">
        <input id="codeInput" placeholder="Room code" maxlength="5" style="text-transform:uppercase">
        <button id="joinBtn">Join</button>
      </div>
      <div class="err" id="lobbyErr"></div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="top">
      <h2>✊✋✌️ RPS Arena</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="pill">Room: <b id="roomCode"></b></span>
        <button id="copyBtn" style="padding:4px 12px;font-size:.85rem">Copy invite link</button>
        <span class="pill" id="countPill"></span>
      </div>
    </div>

    <div class="grid">
      <div class="card arena">
        <div id="arenaBody"></div>
        <div id="controls"></div>
      </div>

      <div class="side">
        <div class="card">
          <h3 style="margin-bottom:8px">Queue</h3>
          <div id="queueList"></div>
          <div style="margin-top:10px" id="queueBtnWrap"></div>
        </div>
        <div class="card">
          <h3 style="margin-bottom:8px">Leaderboard</h3>
          <div class="muted" style="font-size:.8rem;margin-bottom:6px">Spectator points: +1 right move, +1 right outcome</div>
          <div id="board"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG
===================================================================== */
const PREFIX = 'rpsq-';
const MAX_USERS = 32;        // 2 players + 30 spectators
const MAX_SPECTATORS = 30;
const CHOOSE_MS = 20000;     // time to pick a move
const REVEAL_MS = 6000;      // how long the result is shown
const MOVES = ['rock', 'paper', 'scissors'];
const EMO = { rock: '✊', paper: '✋', scissors: '✌️' };
const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = s => String(s || '').replace(/[<>]/g, '').trim().slice(0, 16);

/* =====================================================================
   SHARED CLIENT STATE
===================================================================== */
let isHost = false, peer = null, conn = null, myId = null, roomCode = '';
let S = null;                       // latest state from host
let myMove = null;
let myGuess = { move: null, outcome: null };
let lastKey = null;
let deadline = 0;

/* =====================================================================
   HOST  (authoritative "server" that runs inside the host's browser)
===================================================================== */
const users = new Map();            // id -> {id,name,score,wins,conn}
let queue = [];                     // ordered list of user ids waiting to play
let match = null;                   // current match or null
let lastReveal = null;
let tTimer = null, rTimer = null, keyCounter = 0;

function hostSend(id, msg) {
  const u = users.get(id);
  if (!u) return;
  if (id === 'host') { setTimeout(() => onData(msg), 0); return; }
  try { if (u.conn && u.conn.open) u.conn.send(msg); } catch (e) {}
}

function isPlayer(id) { return match && (match.p1 === id || match.p2 === id); }

function publicState() {
  const m = match ? {
    key: match.key, p1: match.p1, p2: match.p2, featured: match.featured,
    phase: match.phase, round: match.round,
    locked: { [match.p1]: !!match.moves[match.p1], [match.p2]: !!match.moves[match.p2] },
    msLeft: Math.max(0, match.endsAt - Date.now()),
    guessCount: Object.keys(match.guesses).length
  } : null;
  return {
    t: 'state',
    users: [...users.values()].map(u => ({ id: u.id, name: u.name, score: u.score, wins: u.wins })),
    queue: queue.slice(),
    match: m,
    reveal: lastReveal,
    spectators: users.size - (match ? 2 : 0)
  };
}

function broadcast() {
  const st = publicState();
  for (const id of users.keys()) hostSend(id, st);
}

function startMatchIfReady() {
  if (match || queue.length < 2) return;
  const p1 = queue.shift(), p2 = queue.shift();
  match = { p1, p2, round: 0, phase: 'choosing', moves: {}, guesses: {}, featured: p1, endsAt: 0, key: 0 };
  lastReveal = null;
  startRound();
}

function startRound() {
  clearTimeout(tTimer); clearTimeout(rTimer);
  match.round++;
  match.key = ++keyCounter;
  match.phase = 'choosing';
  match.moves = {};
  match.guesses = {};
  match.featured = Math.random() < 0.5 ? match.p1 : match.p2;   // the "chosen player" spectators bet on
  match.endsAt = Date.now() + CHOOSE_MS;
  lastReveal = null;
  tTimer = setTimeout(onTimeout, CHOOSE_MS);
}

function onTimeout() {
  if (!match || match.phase !== 'choosing') return;
  const missing = [match.p1, match.p2].filter(p => !match.moves[p]);
  finishRound(missing);
}

function finishRound(missing) {
  clearTimeout(tTimer);
  const m = match;
  const a = m.p1, b = m.p2;
  const ma = m.moves[a] || null, mb = m.moves[b] || null;
  let winner = null, tie = false, forfeit = false;

  if (missing && missing.length) {
    forfeit = true;
    if (missing.length === 1) winner = missing[0] === a ? b : a;
  } else if (ma === mb) {
    tie = true;
  } else {
    winner = BEATS[ma] === mb ? a : b;
  }

  if (winner && users.has(winner)) users.get(winner).wins++;

  let featuredOutcome = null, guessResults = {};
  if (!forfeit) {
    featuredOutcome = tie ? 'tie' : (winner === m.featured ? 'win' : 'lose');
    const featuredMove = m.moves[m.featured];
    for (const [uid, g] of Object.entries(m.guesses)) {
      const u = users.get(uid);
      if (!u) continue;
      const moveOk = g.move ? g.move === featuredMove : null;
      const outOk = g.outcome ? g.outcome === featuredOutcome : null;
      u.score += (moveOk ? 1 : 0) + (outOk ? 1 : 0);
      guessResults[uid] = { move: g.move || null, outcome: g.outcome || null, moveOk, outOk };
    }
  }

  const nm = id => users.has(id) ? users.get(id).name : '(left)';
  lastReveal = {
    key: m.key, n1: nm(a), n2: nm(b), p1: a, p2: b, m1: ma, m2: mb,
    winner, winnerName: winner ? nm(winner) : null, tie, forfeit,
    missing: missing || [], featured: m.featured, featuredName: nm(m.featured),
    featuredOutcome, guessResults
  };
  m.phase = 'reveal';
  clearTimeout(rTimer);
  rTimer = setTimeout(afterReveal, REVEAL_MS);
  broadcast();
}

function afterReveal() {
  if (!match) return;
  const rematch = lastReveal && lastReveal.tie && users.has(match.p1) && users.has(match.p2);
  if (rematch) {
    startRound();            // tie -> same two players play again
  } else {
    match = null;            // game over: both players lose their number and become spectators
    startMatchIfReady();     // next 2 in line play
  }
  broadcast();
}

function removeUser(id) {
  if (!users.has(id)) return;
  users.delete(id);
  queue = queue.filter(x => x !== id);
  if (match) {
    delete match.guesses[id];
    if (isPlayer(id) && match.phase === 'choosing') { finishRound([id]); return; }
  }
  broadcast();
}

function handle(id, d, c) {
  if (!d || typeof d !== 'object') return;

  if (d.t === 'hello') {
    if (users.has(id)) return;
    if (users.size >= MAX_USERS) {
      try { c.send({ t: 'full' }); setTimeout(() => c.close(), 300); } catch (e) {}
      return;
    }
    users.set(id, { id, name: clean(d.name) || 'Player', score: 0, wins: 0, conn: c });
    hostSend(id, { t: 'welcome', id, room: roomCode });
    broadcast();
    return;
  }

  if (!users.has(id)) return;

  switch (d.t) {
    case 'join':   // request to play -> enters the queue (one number per person)
      if (queue.includes(id) || isPlayer(id)) return;
      queue.push(id);
      startMatchIfReady();
      broadcast();
      break;

    case 'leave':
      queue = queue.filter(x => x !== id);
      broadcast();
      break;

    case 'move':
      if (!match || match.phase !== 'choosing' || !isPlayer(id)) return;
      if (match.moves[id] || !MOVES.includes(d.m)) return;
      match.moves[id] = d.m;
      if (match.moves[match.p1] && match.moves[match.p2]) finishRound([]);
      else broadcast();
      break;

    case 'guess': {
      if (!match || match.phase !== 'choosing' || isPlayer(id)) return;
      const g = match.guesses[id] || (match.guesses[id] = {});
      if (MOVES.includes(d.move)) g.move = d.move;
      if (['win', 'lose', 'tie'].includes(d.outcome)) g.outcome = d.outcome;
      broadcast();
      break;
    }
  }
}

/* ---------- host networking ---------- */
function createRoom() {
  const name = clean($('nameInput').value);
  if (!name) return lobbyErr('Please enter your name.');
  lobbyErr('');
  $('createBtn').disabled = true;
  isHost = true;
  tryOpenRoom(name, 0);
}

function randCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = ''; for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function tryOpenRoom(name, attempt) {
  const code = randCode();
  const p = new Peer(PREFIX + code);
  p.on('open', () => {
    peer = p; roomCode = code;
    p.on('connection', c => {
      c.on('data', d => handle(c.peer, d, c));
      c.on('close', () => removeUser(c.peer));
      c.on('error', () => removeUser(c.peer));
    });
    p.on('disconnected', () => { try { p.reconnect(); } catch (e) {} });
    handle('host', { t: 'hello', name }, null);
  });
  p.on('error', err => {
    if (err.type === 'unavailable-id' && attempt < 5) { try { p.destroy(); } catch (e) {} return tryOpenRoom(name, attempt + 1); }
    lobbyErr('Could not create room: ' + (err.type || err));
    $('createBtn').disabled = false; isHost = false;
  });
}

/* =====================================================================
   CLIENT networking (non-host players / spectators)
===================================================================== */
function joinRoom() {
  const name = clean($('nameInput').value);
  const code = $('codeInput').value.trim().toUpperCase();
  if (!name) return lobbyErr('Please enter your name.');
  if (code.length !== 5) return lobbyErr('Enter the 5-character room code.');
  lobbyErr(''); $('joinBtn').disabled = true;
  isHost = false;
  roomCode = code;
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect(PREFIX + code, { reliable: true });
    const timeout = setTimeout(() => { lobbyErr('Room not found or host unreachable.'); resetLobby(); }, 10000);
    conn.on('open', () => { clearTimeout(timeout); conn.send({ t: 'hello', name }); });
    conn.on('data', onData);
    conn.on('close', () => { if (myId) hostGone(); });
    conn.on('error', () => { clearTimeout(timeout); lobbyErr('Connection error.'); resetLobby(); });
  });
  peer.on('error', err => { lobbyErr(err.type === 'peer-unavailable' ? 'Room not found.' : 'Error: ' + (err.type || err)); resetLobby(); });
}

function resetLobby() { $('joinBtn').disabled = false; $('createBtn').disabled = false; try { peer && peer.destroy(); } catch (e) {} }
function hostGone() { alert('The host left. The room is closed.'); location.reload(); }

function sendToHost(msg) {
  if (isHost) handle('host', msg, null);
  else if (conn && conn.open) conn.send(msg);
}

function onData(d) {
  if (d.t === 'welcome') {
    myId = d.id; roomCode = d.room || roomCode;
    $('lobby').classList.add('hidden'); $('game').classList.remove('hidden');
    $('roomCode').textContent = roomCode;
  } else if (d.t === 'full') {
    lobbyErr('Room is full (2 players + 30 spectators).'); resetLobby();
  } else if (d.t === 'state') {
    S = d;
    if (d.match) {
      if (d.match.key !== lastKey) { lastKey = d.match.key; myMove = null; myGuess = { move: null, outcome: null }; }
      deadline = Date.now() + d.match.msLeft;
    }
    render();
  }
}

/* =====================================================================
   UI actions
===================================================================== */
function chooseMove(m) { if (myMove) return; myMove = m; sendToHost({ t: 'move', m }); render(); }
function guessMove(m) { myGuess.move = m; sendToHost({ t: 'guess', move: m }); render(); }
function guessOutcome(o) { myGuess.outcome = o; sendToHost({ t: 'guess', outcome: o }); render(); }
function toggleQueue() {
  const inQ = S && S.queue.includes(myId);
  sendToHost({ t: inQ ? 'leave' : 'join' });
}
function lobbyErr(t) { $('lobbyErr').textContent = t; }

/* =====================================================================
   RENDER
===================================================================== */
const nameOf = id => { const u = S.users.find(u => u.id === id); return u ? u.name : '(left)'; };

function render() {
  if (!S) return;
  const m = S.match;
  const iPlay = m && (m.p1 === myId || m.p2 === myId);
  const inQ = S.queue.includes(myId);

  $('countPill').textContent = `Spectators ${Math.max(0, Math.min(S.spectators, MAX_SPECTATORS))}/${MAX_SPECTATORS} • Online ${S.users.length}/${MAX_USERS}`;

  /* ---- arena ---- */
  let h = '';
  if (!m) {
    h += `<div class="banner">${S.queue.length < 2 ? 'Waiting for 2 players in the queue… (' + S.queue.length + '/2)' : 'Starting match…'}</div>`;
    if (S.reveal) h += resultHtml(S.reveal, 'Last game');
  } else {
    const rv = (m.phase === 'reveal') ? S.reveal : null;
    h += `<div class="muted">Round ${m.round}${m.phase === 'choosing' ? '' : ' – result'}</div>`;
    h += '<div class="vs">' + fighterHtml(m, m.p1, rv, 1) + '<div style="font-size:1.4rem;font-weight:700">VS</div>' + fighterHtml(m, m.p2, rv, 2) + '</div>';
    if (m.phase === 'choosing') {
      h += `<div class="bar"><div id="timerBar"></div></div>`;
      h += `<div class="muted" style="font-size:.85rem">${m.guessCount} spectator guess${m.guessCount === 1 ? '' : 'es'} placed</div>`;
    } else if (rv) {
      h += resultHtml(rv);
    }
  }
  $('arenaBody').innerHTML = h;

  /* ---- controls ---- */
  let c = '';
  if (m && m.phase === 'choosing') {
    if (iPlay) {
      if (!myMove) {
        c += '<div style="margin-bottom:8px"><b>Your turn – choose!</b></div><div class="moves">' +
          MOVES.map(x => `<button onclick="chooseMove('${x}')">${EMO[x]}<small>${x}</small></button>`).join('') + '</div>';
      } else {
        c += `<div class="banner good">You chose ${EMO[myMove]} ${myMove}. Waiting for your opponent…</div>`;
      }
    } else {
      c += `<div class="guess"><div class="banner">You're a spectator. Guess what <b>⭐ ${esc(nameOf(m.featured))}</b> will play and whether they'll win!</div>
        <h3>Their move</h3><div class="moves">${MOVES.map(x => `<button class="${myGuess.move === x ? 'sel' : ''}" onclick="guessMove('${x}')">${EMO[x]}<small>${x}</small></button>`).join('')}</div>
        <h3>Their result</h3><div class="moves">${['win', 'lose', 'tie'].map(x => `<button class="${myGuess.outcome === x ? 'sel' : ''}" onclick="guessOutcome('${x}')">${x === 'win' ? '🏆' : x === 'lose' ? '💀' : '🤝'}<small>${x}</small></button>`).join('')}</div>
        <div class="muted" style="font-size:.8rem;margin-top:6px">You can change your guess until both players have picked.</div></div>`;
    }
  } else if (m && m.phase === 'reveal' && !iPlay && S.reveal && S.reveal.guessResults && S.reveal.guessResults[myId]) {
    const g = S.reveal.guessResults[myId];
    c += `<div class="banner ${(g.moveOk || g.outOk) ? 'good' : 'bad'}">Your guess: move ${g.move ? EMO[g.move] : '–'} ${g.moveOk ? '✅' : g.move ? '❌' : ''} &nbsp; result ${g.outcome || '–'} ${g.outOk ? '✅' : g.outcome ? '❌' : ''}</div>`;
  }
  $('controls').innerHTML = c;

  /* ---- queue ---- */
  $('queueList').innerHTML = S.queue.length
    ? '<ul>' + S.queue.map((id, i) => `<li><span><span class="num">${i + 1}</span><span class="${id === myId ? 'me' : ''}">${esc(nameOf(id))}${id === myId ? ' (you)' : ''}</span></span>${i < 2 ? '<span class="muted">next up</span>' : ''}</li>`).join('') + '</ul>'
    : '<div class="muted">Queue is empty.</div>';

  let qb = '';
  if (iPlay) qb = '<div class="muted" style="font-size:.85rem">You are playing. After the game you can queue again.</div>';
  else qb = `<button class="${inQ ? '' : 'primary'}" style="width:100%" onclick="toggleQueue()">${inQ ? 'Leave queue (you are #' + (S.queue.indexOf(myId) + 1) + ')' : 'I want to play (join queue)'}</button>`;
  $('queueBtnWrap').innerHTML = qb;

  /* ---- leaderboard ---- */
  const sorted = S.users.slice().sort((a, b) => b.score - a.score || b.wins - a.wins);
  $('board').innerHTML = '<ul>' + sorted.map(u => {
    const role = m && (m.p1 === u.id || m.p2 === u.id) ? '🎮' : S.queue.includes(u.id) ? '#' + (S.queue.indexOf(u.id) + 1) : '👀';
    return `<li><span class="${u.id === myId ? 'me' : ''}">${role} ${esc(u.name)}</span><span>${u.score} pts • ${u.wins}W</span></li>`;
  }).join('') + '</ul>';
}

function fighterHtml(m, id, rv, idx) {
  const feat = m.featured === id;
  let big = '❔', cls = 'fighter' + (feat ? ' featured' : '');
  if (rv) {
    const mv = idx === 1 ? rv.m1 : rv.m2;
    big = mv ? EMO[mv] : '💤';
    if (rv.winner === id) cls += ' winner';
  } else {
    big = m.locked[id] ? '🔒' : '🤔';
  }
  return `<div class="${cls}"><div class="name ${id === myId ? 'me' : ''}">${esc(nameOf(id))}${id === myId ? ' (you)' : ''}</div><div class="big">${big}</div>${feat ? '<div class="tag">⭐ featured for guessing</div>' : '<div class="tag">&nbsp;</div>'}</div>`;
}

function resultHtml(r, label) {
  let t, cls = '';
  if (r.forfeit) {
    t = r.winnerName ? `${esc(r.winnerName)} wins by forfeit (opponent did not play).` : 'Nobody played – no winner.';
  } else if (r.tie) {
    t = `Tie! ${EMO[r.m1]} vs ${EMO[r.m2]} – rematch with the same players…`;
  } else {
    t = `🏆 ${esc(r.winnerName)} wins! ${EMO[r.m1]} vs ${EMO[r.m2]}`;
    cls = 'good';
  }
  return `<div class="banner ${cls}">${label ? '<b>' + label + ':</b> ' : ''}${t}${r.featuredOutcome ? `<div class="muted" style="font-size:.85rem;margin-top:4px">Featured player ⭐ ${esc(r.featuredName)}: ${r.featuredOutcome}</div>` : ''}</div>`;
}

/* countdown bar */
setInterval(() => {
  const bar = $('timerBar');
  if (!bar || !S || !S.match || S.match.phase !== 'choosing') return;
  const left = Math.max(0, deadline - Date.now());
  bar.style.width = (left / CHOOSE_MS * 100) + '%';
}, 200);

   INIT
===================================================================== */
$('createBtn').onclick = createRoom;
$('joinBtn').onclick = joinRoom;
$('copyBtn').onclick = () => {
  const url = location.href.split('#')[0] + '#' + roomCode;
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
    () => $('copyBtn').textContent = 'Copied!', () => prompt('Invite link:', url));
  setTimeout(() => $('copyBtn').textContent = 'Copy invite link', 1500);
};
const h = location.hash.replace('#', '').toUpperCase();
if (h.length === 5) $('codeInput').value = h;
window.addEventListener('beforeunload', () => { try { peer && peer.destroy(); } catch (e) {} });
